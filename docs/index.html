            <script>function neighbourhoodHighlight(params) {
  // console.log("in nieghbourhoodhighlight");
  allNodes = nodes.get({ returnType: "Object" });
  // originalNodes = JSON.parse(JSON.stringify(allNodes));
  // if something is selected:
  if (params.nodes.length > 0) {
    highlightActive = true;
    var i, j;
    var selectedNode = params.nodes[0];
    var degrees = 2;

    // mark all nodes as hard to read.
    for (let nodeId in allNodes) {
      // nodeColors[nodeId] = allNodes[nodeId].color;
      allNodes[nodeId].color = "rgba(200,200,200,0.5)";
      if (allNodes[nodeId].hiddenLabel === undefined) {
        allNodes[nodeId].hiddenLabel = allNodes[nodeId].label;
        allNodes[nodeId].label = undefined;
      }
    }
    var connectedNodes = network.getConnectedNodes(selectedNode);
    var allConnectedNodes = [];

    // get the second degree nodes
    for (i = 1; i < degrees; i++) {
      for (j = 0; j < connectedNodes.length; j++) {
        allConnectedNodes = allConnectedNodes.concat(
          network.getConnectedNodes(connectedNodes[j])
        );
      }
    }

    // all second degree nodes get a different color and their label back
    for (i = 0; i < allConnectedNodes.length; i++) {
      // allNodes[allConnectedNodes[i]].color = "pink";
      allNodes[allConnectedNodes[i]].color = "rgba(150,150,150,0.75)";
      if (allNodes[allConnectedNodes[i]].hiddenLabel !== undefined) {
        allNodes[allConnectedNodes[i]].label =
          allNodes[allConnectedNodes[i]].hiddenLabel;
        allNodes[allConnectedNodes[i]].hiddenLabel = undefined;
      }
    }

    // all first degree nodes get their own color and their label back
    for (i = 0; i < connectedNodes.length; i++) {
      // allNodes[connectedNodes[i]].color = undefined;
      allNodes[connectedNodes[i]].color = nodeColors[connectedNodes[i]];
      if (allNodes[connectedNodes[i]].hiddenLabel !== undefined) {
        allNodes[connectedNodes[i]].label =
          allNodes[connectedNodes[i]].hiddenLabel;
        allNodes[connectedNodes[i]].hiddenLabel = undefined;
      }
    }

    // the main node gets its own color and its label back.
    // allNodes[selectedNode].color = undefined;
    allNodes[selectedNode].color = nodeColors[selectedNode];
    if (allNodes[selectedNode].hiddenLabel !== undefined) {
      allNodes[selectedNode].label = allNodes[selectedNode].hiddenLabel;
      allNodes[selectedNode].hiddenLabel = undefined;
    }
  } else if (highlightActive === true) {
    // console.log("highlightActive was true");
    // reset all nodes
    for (let nodeId in allNodes) {
      // allNodes[nodeId].color = "purple";
      allNodes[nodeId].color = nodeColors[nodeId];
      // delete allNodes[nodeId].color;
      if (allNodes[nodeId].hiddenLabel !== undefined) {
        allNodes[nodeId].label = allNodes[nodeId].hiddenLabel;
        allNodes[nodeId].hiddenLabel = undefined;
      }
    }
    highlightActive = false;
  }

  // transform the object into an array
  var updateArray = [];
  if (params.nodes.length > 0) {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        // console.log(allNodes[nodeId]);
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  } else {
    // console.log("Nothing was selected");
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        // console.log(allNodes[nodeId]);
        // allNodes[nodeId].color = {};
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  }
}

function filterHighlight(params) {
  allNodes = nodes.get({ returnType: "Object" });
  // if something is selected:
  if (params.nodes.length > 0) {
    filterActive = true;
    let selectedNodes = params.nodes;

    // hiding all nodes and saving the label
    for (let nodeId in allNodes) {
      allNodes[nodeId].hidden = true;
      if (allNodes[nodeId].savedLabel === undefined) {
        allNodes[nodeId].savedLabel = allNodes[nodeId].label;
        allNodes[nodeId].label = undefined;
      }
    }

    for (let i=0; i < selectedNodes.length; i++) {
      allNodes[selectedNodes[i]].hidden = false;
      if (allNodes[selectedNodes[i]].savedLabel !== undefined) {
        allNodes[selectedNodes[i]].label = allNodes[selectedNodes[i]].savedLabel;
        allNodes[selectedNodes[i]].savedLabel = undefined;
      }
    }

  } else if (filterActive === true) {
    // reset all nodes
    for (let nodeId in allNodes) {
      allNodes[nodeId].hidden = false;
      if (allNodes[nodeId].savedLabel !== undefined) {
        allNodes[nodeId].label = allNodes[nodeId].savedLabel;
        allNodes[nodeId].savedLabel = undefined;
      }
    }
    filterActive = false;
  }

  // transform the object into an array
  var updateArray = [];
  if (params.nodes.length > 0) {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  } else {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  }
}

function selectNode(nodes) {
  network.selectNodes(nodes);
  neighbourhoodHighlight({ nodes: nodes });
  return nodes;
}

function selectNodes(nodes) {
  network.selectNodes(nodes);
  filterHighlight({nodes: nodes});
  return nodes;
}

function highlightFilter(filter) {
  let selectedNodes = []
  let selectedProp = filter['property']
  if (filter['item'] === 'node') {
    let allNodes = nodes.get({ returnType: "Object" });
    for (let nodeId in allNodes) {
      if (allNodes[nodeId][selectedProp] && filter['value'].includes((allNodes[nodeId][selectedProp]).toString())) {
        selectedNodes.push(nodeId)
      }
    }
  }
  else if (filter['item'] === 'edge'){
    let allEdges = edges.get({returnType: 'object'});
    // check if the selected property exists for selected edge and select the nodes connected to the edge
    for (let edge in allEdges) {
      if (allEdges[edge][selectedProp] && filter['value'].includes((allEdges[edge][selectedProp]).toString())) {
        selectedNodes.push(allEdges[edge]['from'])
        selectedNodes.push(allEdges[edge]['to'])
      }
    }
  }
  selectNodes(selectedNodes)
}</script>

b\u003e 8.4 Sine, Cosine, and Tangent Ratios Trigonometry is the study of the relationships between sides and angles of right triangles.\u003cbr/\u003e\u003csmall\u003e\u003ci\u003eLocation:\u003c/i\u003e Chapter 8: Right Triangle Trigonometry (Page 6)\u003c/small\u003e"}, {"concept_name": "concurrency", "concept_type": "Concept", "definition": "The circumcenter is the point of concurrency of the perpendicular bisectors and is equidistant from each vertex.", "group": 1, "id": "C0040", "label": "concurrency", "shape": "dot", "size": 13, "title": "\u003cb\u003econcurrency\u003c/b\u003e (Concept)\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eDefinition:\u003c/b\u003e The circumcenter is the point of concurrency of the perpendicular bisectors and is equidistant from each vertex.\u003cbr/\u003e\u003csmall\u003e\u003ci\u003eLocation:\u003c/i\u003e Chapter 5: Relationships with Triangles (Page 4)\u003c/small\u003e"}, {"concept_name": "isosceles triangle", "concept_type": "Concept", "definition": "An isosceles triangle has at least two congruent sides.", "group": 1, "id": "C0094", "label": "isosceles triangle", "shape": "dot", "size": 12, "title": "\u003cb\u003eisosceles triangle\u003c/b\u003e (Concept)\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eDefinition:\u003c/b\u003e An isosceles triangle has at least two congruent sides.\u003cbr/\u003e\u003cb\u003eAliases:\u003c/b\u003e Isosceles Triangles\u003cbr/\u003e\u003csmall\u003e\u003ci\u003eLocation:\u003c/i\u003e Chapter 1: Basics of Geometry (Page 2)\u003c/small\u003e"}, {"concept_name": "diagonal", "concept_type": "Concept", "definition": "A diagonal is a segment connecting two non-adjacent vertices.", "group": 1, "id": "C0067", "label": "diagonal", "shape": "dot", "size": 13, "title": "\u003cb\u003ediagonal\u003c/b\u003e (Concept)\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eDefinition:\u003c/b\u003e A diagonal is a segment connecting two non-adjacent vertices.\u003cbr/\u003e\u003cb\u003eAliases:\u003c/b\u003e diagonals\u003cbr/\u ces, straight edges, and vertices.", "group": 1, "id": "C0202", "label": "vertices", "shape": "dot", "size": 13, "title": "\u003cb\u003evertices\u003c/b\u003e (Concept)\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eDefinition:\u003c/b\u003e 11.1 Polyhedrons A polyhedron is a three-dimensional figure with flat polygon faces, straight edges, and vertices.\u003cbr/\u003e\u003csmall\u003e\u003ci\u003eLocation:\u003c/i\u003e Chapter 11: Surface Area and Volume (Page 8)\u003c/small\u003e"}, {"concept_name": "Lines Parallel", "concept_type": "Concept", "definition": "3.3 Proving Lines Parallel The converse of corresponding angles postulate states that if two lines are cut by a transversal and corresponding angles are congruent, then the lines are parallel.", "group": 1, "id": "C0105", "label": "Lines Parallel", "shape": "dot", "size": 18, "title": "\u003cb\u003eLines Parallel\u003c/b\u003e (Concept)\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eDefinition:\u003c/b\u003e 3.3 Proving Lines Parallel The converse of corresponding angles postulate states that if two lines are cut by a transversal and corresponding angles are congruent, then the lines are parallel.\u003cbr/\u003e\u003csmall\u003e\u003ci\u003eLocation:\u003c/i\u003e Chapter 3: Parallel and Perpendicular Lines (Page 3)\u003c/small\u003e"}, {"concept_name": "quadrilateral", "concept_type": "Concept", "definition": "A quadrilateral has four sides.", "group": 1, "id": "C0144", "label": "quadrilateral", "shape": "dot", "size": 12, "title": "\u003cb\u003equadrilateral\u003c/b\u003e (Concept)\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eDefinition:\u003c/b\u003e A quadrilateral has four sides.\u003cbr/\u003e\u003csmall\u003e\u003ci\u003eLocation:\u003c/i\u003e Chapter 1: Basics of Geometry (Page 2)\u003c/small\u003e"}, {"concept_name": "trapezoid", "concept_type": "Concept", "definition": "6.5 Trapezoids and Kites A trapezoid is a quadrilateral with exactly one pair of parallel sides called bases.", "group": 1, "id": "C0191", "label": "trapezoid", "shape": "dot", "size": 13, "title": "\u003cb\u003etrapezoid\u003c/b\u003e (Concept)\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eDefinition:\u003c/b\u003e 6.5 Trapezoids and Kites A trapezoid is a quadrilateral with exactly one pair of parallel sides called bases.\u003cbr/\u003e\u003cb\u003eAliases:\u003c/b\u003e Trapezoids\u003cbr/\u003e\u003csmall\u003e\u003ci\u003eLocation:\u003c/i\u003e Chapter 6: Polygons and Quadrilaterals (Page 5)\u003c/small\u003e"}, {"concept_name": "median", "concept_type": "Concept", "definition": "5.3 Medians and Altitudes A median is a segment from a vertex to the midpoint of the opposite side.", "group": 1, "id": "C0107", "label": "median", "shape": "dot", "size": 13, "title": "\u003cb\u003emedian\u003c/b\u003e (Concept)\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eDefinition:\u003c/b\u003e 5.3 Medians and Altitudes A median is a segment from a vertex to the midpoint of the opposite side.\u003cbr/\u003e\u003cb\u003eAliases:\u003c/b\u003e Medians\u003cbr/\u003e\u003csmall\u003e\u003ci\u003eLocation:\u003c/i\u003e Chapter 5: Relationships with Triangles (Page 5)\u003c/small\u003e"}, {"concept_name": "arc addition postulate", "concept_type": "Concept", "definition": "The arc addition postulate states that adjacent arc measures can be added.", "group": 1, "id": "C0016", "label": "arc addition postulate", "shape": "dot", "size": 14, "title": "\u003cb\u003earc addition postulate\u003c/b\u003e (Concept)\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eDefinition:\u003c/b\u003e The arc addition postulate states that adjacent arc measures can be added.\u003cbr/\u003e\u003csmall\u003e\u003ci\u003eLocation:\u003c/i\u003e Chapter 9: Circles (Page 7)\u003c/small\u003e"}, {"concept_name": "Pythagorean Theorem", "concept_type": "Concept", "definition": "The Pythagorean theorem states that in a right triangle, the square of the hypotenuse equals the sum of the squares of the legs.", "group": 1, "id": "C0142", "label": "Pythagorean Theorem", "shape": "dot", "size": 20, "title": "\u003cb\u003ePythagorean Theorem\u003c/b\u003e (Concept)\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eDefinition:\u003c/b\u003e The Pythagorean theorem states that in a right triangle, the square of the hypotenuse equals the sum of the squares of the legs.\u003cbr/\u003e\u003csmall\u003e\u003ci\u003eLocation:\u003c/i\u003e Chapter 8: Right Triangle Trigonometry (Page 6)\u003c/small\u003e"}, {"concept_name": "triangle proportionality theorem", "concept_type": "Concept", "definition": "The triangle proportionality theorem states that if a line is parallel to one side of a triangle and intersects the other two sides, it divides those sides proportionally.", "group": 1, "id": "C0196", "label": "triangle proportionality theorem", "shape": "dot", "size": 13, "title": "\u003cb\u003etriangle proportionality theorem\u003c/b\u003e (Concept)\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eDefinition:\u003c/b\u003e The triangle proportionality theorem states that if a line is parallel to one side of a triangle and intersects the other two sides, it divides those sides proportionally.\u003cbr/\u003e\u003csmall\u003e\u003ci\u003eLocation:\u003c/i\u003e Chapter 7: Similarity (Page 6)\u003c/small\u003e"}, {"concept_name": "CPCTC", "concept_type": "Concept", "definition": "The corresponding parts of congruent triangles are congruent is abbreviated CPCTC.", "group": 1, "id": "C0061", "label": "CPCTC", "shape": "dot", "size": 16, "title": "\u003cb\u003eCPCTC\u003c/b\u003e (Concept)\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eDefinition:\u003c/b\u003e The corresponding parts of congruent triangles are congruent is abbreviated CPCTC.\u003cbr/\u003e\u003csmall\u003e\u003ci\u003eLocation:\u003c/i\u003e Chapter 4: Triangles and Congruence (Page 4)\u003c/small\u003e"}, {"concept_name": "perpendicular bisector theorem", "concept_type": "Concept", "definition": "The perpendicular bisector theorem states that any point on the perpendicular bisector of a segment is equidistant from the endpoints.", "group": 1, "id": "C0128", "label": "perpendicular bisector theorem", "shape": "dot", "size": 14, "title": "\u003cb\u003eperpendicular bisector theorem\u003c/b\u003e (Concept)\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eDefinition:\u003c/b\u003e The perpendicular bisector theorem states that any point on the perpendicular bisector of a segment is equidistant from the endpoints.\u003cbr/\u003e\u003csmall\u003e\u003ci\u003eLocation:\u003c/i\u003e Chapter 5: Relationships with Triangles (Page 4)\u003c/small\u003e"}, {"concept_name": "Arc Length", "concept_type": "Concept", "definition": "An arc length is a portion of the circumference equal to the arc measure divided by 360 times the circumference.", "group": 1, "id": "C0017", "label": "Arc Length", "shape": "dot", "size": 21, "title": "\u003cb\u003eArc Length\u003c/b\u003e (Concept)\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eDefinition:\u003c/b\u003e An arc length is a portion of the circumference equal to the arc measure divided by 360 times the circumference.\u003cbr/\u003e\u003csmall\u003e\u003ci\u003eLocation:\u003c/i\u003e Chapter 10: Perimeter and Area (Page 8)\u003c/small\u003e"}, {"concept_name": "Congruent arcs", "concept_type": "Concept", "definition": "Congruent arcs have equal measures and are in the same circle.", "group": 1, "id": "C0045", "label": "Congruent arcs", "shape": "dot", "size": 14, "title": "\u003cb\u003eCongruent arcs\u003c/b\u003e (Concept)\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eDefinition:\u003c/b\u003e Congruent arcs have equal measures and are in the same circle.\u003cbr/\u003e\u003csmall\u003e\u003ci\u003eLocation:\u003c/i\u003e Chapter 9: Circles (Page 7)\u003c/small\u003e"}, {"concept_name": "area of a sector", "concept_type": "Concept", "definition": "The area of a sector is the arc measure divided by 360 times the area of the circle.", "group": 1, "id": "C0021", "label": "area of a sector", "shape": "dot", "size": 18, "title": "\u003cb\u003earea of a sector\u003c/b\u003e (Concept)\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eDefinition:\u003c/b\u003e The area of a sector is the arc measure divided by 360 times the area of the circle.\u003cbr/\u003e\u003csmall\u003e\u003ci\u003eLocation:\u003c/i\u003e Chapter 10: Perimeter and Area (Page 8)\u003c/small\u003e"}, {"concept_name": "sector", "concept_type": "Concept", "definition": "10.5 Areas of Circles and Sectors The area of a circle is pi times the radius squared.", "group": 1, "id": "C0164", "label": "sector", "shape": "dot", "size": 13, "title": "\u003cb\u003esector\u003c/b\u003e (Concept)\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eDefinition:\u003c/b\u003e 10.5 Areas of Circles and Sectors The area of a circle is pi times the radius squared.\u003cbr/\u003e\u003cb\u003eAliases:\u003c/b\u003e Sectors\u003cbr/\u003e\u003csmall\u003e\u003ci\u003eLocation:\u003c/i\u003e Chapter 10: Perimeter and Area (Page 8)\u003c/small\u003e"}, {"concept_name": "Circumference", "concept_type": "Concept", "definition": "The circumference of a circle is two pi times the radius or pi times the diameter.", "group": 1, "id": "C0033", "label": "Circumference", "shape": "dot", "size": 16, "title": "\u003cb\u003eCircumference\u003c/b\u003e (Concept)\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eDefinition:\u003c/b\u003e The circumference of a circle is two pi times the radius or pi times the diameter.\u003cbr/\u003e\u003csmall\u003e\u003ci\u003eLocation:\u003c/i\u003e Chapter 10: Perimeter and Area (Page 8)\u003c/small\u003e"}, {"concept_name": "area of a circle", "concept_type": "Concept", "definition": "The area of a circle is pi times the radius squared.", "group": 1, "id": "C0018", "label": "area of a circle", "shape": "dot", "size": 16, "title": "\u003cb\u003earea of a circle\u003c/b\u003e (Concept)\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eDefinition:\u003c/b\u003e The area of a circle is pi times the radius squared.\u003cbr/\u003e\u003csmall\u003e\u003ci\u003eLocation:\u003c/i\u003e Chapter 1
