            <script>function neighbourhoodHighlight(params) {
  // console.log("in nieghbourhoodhighlight");
  allNodes = nodes.get({ returnType: "Object" });
  // originalNodes = JSON.parse(JSON.stringify(allNodes));
  // if something is selected:
  if (params.nodes.length > 0) {
    highlightActive = true;
    var i, j;
    var selectedNode = params.nodes[0];
    var degrees = 2;

    // mark all nodes as hard to read.
    for (let nodeId in allNodes) {
      // nodeColors[nodeId] = allNodes[nodeId].color;
      allNodes[nodeId].color = "rgba(200,200,200,0.5)";
      if (allNodes[nodeId].hiddenLabel === undefined) {
        allNodes[nodeId].hiddenLabel = allNodes[nodeId].label;
        allNodes[nodeId].label = undefined;
      }
    }
    var connectedNodes = network.getConnectedNodes(selectedNode);
    var allConnectedNodes = [];

    // get the second degree nodes
    for (i = 1; i < degrees; i++) {
      for (j = 0; j < connectedNodes.length; j++) {
        allConnectedNodes = allConnectedNodes.concat(
          network.getConnectedNodes(connectedNodes[j])
        );
      }
    }

    // all second degree nodes get a different color and their label back
    for (i = 0; i < allConnectedNodes.length; i++) {
      // allNodes[allConnectedNodes[i]].color = "pink";
      allNodes[allConnectedNodes[i]].color = "rgba(150,150,150,0.75)";
      if (allNodes[allConnectedNodes[i]].hiddenLabel !== undefined) {
        allNodes[allConnectedNodes[i]].label =
          allNodes[allConnectedNodes[i]].hiddenLabel;
        allNodes[allConnectedNodes[i]].hiddenLabel = undefined;
      }
    }

    // all first degree nodes get their own color and their label back
    for (i = 0; i < connectedNodes.length; i++) {
      // allNodes[connectedNodes[i]].color = undefined;
      allNodes[connectedNodes[i]].color = nodeColors[connectedNodes[i]];
      if (allNodes[connectedNodes[i]].hiddenLabel !== undefined) {
        allNodes[connectedNodes[i]].label =
          allNodes[connectedNodes[i]].hiddenLabel;
        allNodes[connectedNodes[i]].hiddenLabel = undefined;
      }
    }

    // the main node gets its own color and its label back.
    // allNodes[selectedNode].color = undefined;
    allNodes[selectedNode].color = nodeColors[selectedNode];
    if (allNodes[selectedNode].hiddenLabel !== undefined) {
      allNodes[selectedNode].label = allNodes[selectedNode].hiddenLabel;
      allNodes[selectedNode].hiddenLabel = undefined;
    }
  } else if (highlightActive === true) {
    // console.log("highlightActive was true");
    // reset all nodes
    for (let nodeId in allNodes) {
      // allNodes[nodeId].color = "purple";
      allNodes[nodeId].color = nodeColors[nodeId];
      // delete allNodes[nodeId].color;
      if (allNodes[nodeId].hiddenLabel !== undefined) {
        allNodes[nodeId].label = allNodes[nodeId].hiddenLabel;
        allNodes[nodeId].hiddenLabel = undefined;
      }
    }
    highlightActive = false;
  }

  // transform the object into an array
  var updateArray = [];
  if (params.nodes.length > 0) {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        // console.log(allNodes[nodeId]);
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  } else {
    // console.log("Nothing was selected");
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        // console.log(allNodes[nodeId]);
        // allNodes[nodeId].color = {};
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  }
}

function filterHighlight(params) {
  allNodes = nodes.get({ returnType: "Object" });
  // if something is selected:
  if (params.nodes.length > 0) {
    filterActive = true;
    let selectedNodes = params.nodes;

    // hiding all nodes and saving the label
    for (let nodeId in allNodes) {
      allNodes[nodeId].hidden = true;
      if (allNodes[nodeId].savedLabel === undefined) {
        allNodes[nodeId].savedLabel = allNodes[nodeId].label;
        allNodes[nodeId].label = undefined;
      }
    }

    for (let i=0; i < selectedNodes.length; i++) {
      allNodes[selectedNodes[i]].hidden = false;
      if (allNodes[selectedNodes[i]].savedLabel !== undefined) {
        allNodes[selectedNodes[i]].label = allNodes[selectedNodes[i]].savedLabel;
        allNodes[selectedNodes[i]].savedLabel = undefined;
      }
    }

  } else if (filterActive === true) {
    // reset all nodes
    for (let nodeId in allNodes) {
      allNodes[nodeId].hidden = false;
      if (allNodes[nodeId].savedLabel !== undefined) {
        allNodes[nodeId].label = allNodes[nodeId].savedLabel;
        allNodes[nodeId].savedLabel = undefined;
      }
    }
    filterActive = false;
  }

  // transform the object into an array
  var updateArray = [];
  if (params.nodes.length > 0) {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  } else {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  }
}

function selectNode(nodes) {
  network.selectNodes(nodes);
  neighbourhoodHighlight({ nodes: nodes });
  return nodes;
}

function selectNodes(nodes) {
  network.selectNodes(nodes);
  filterHighlight({nodes: nodes});
  return nodes;
}

function highlightFilter(filter) {
  let selectedNodes = []
  let selectedProp = filter['property']
  if (filter['item'] === 'node') {
    let allNodes = nodes.get({ returnType: "Object" });
    for (let nodeId in allNodes) {
      if (allNodes[nodeId][selectedProp] && filter['value'].includes((allNodes[nodeId][selectedProp]).toString())) {
        selectedNodes.push(nodeId)
      }
    }
  }
  else if (filter['item'] === 'edge'){
    let allEdges = edges.get({returnType: 'object'});
    // check if the selected property exists for selected edge and select the nodes connected to the edge
    for (let edge in allEdges) {
      if (allEdges[edge][selectedProp] && filter['value'].includes((allEdges[edge][selectedProp]).toString())) {
        selectedNodes.push(allEdges[edge]['from'])
        selectedNodes.push(allEdges[edge]['to'])
      }
    }
  }
  selectNodes(selectedNodes)
}</script>

}, {"arrows": "to", "color": "#0077b6", "from": "C0062", "relation_type": "Part-of", "title": "\u003cb\u003ehealth policy\u003c/b\u003e \u0026rarr; \u003cb\u003eindia\u003c/b\u003e\u003cbr/\u003e\u003cb\u003eRelation:\u003c/b\u003e Part-of (Weight: 9)\u003cbr/\u003e\u003ci\u003eEvidence:\u003c/i\u003e \u0026ldquo;The presented study aims to analyze the implementation of India\u0027s Health Sector Reform (HSR) in terms of its impact on human resource, specifically auxiliary nurse midwives (ANMs), under India\u0027s Public Health Standards (IPHS). The study is a part of the larger project \u0027Strengthening health systems in Tamil Nadu through implementation research\u0027 (SHaTTh-IR), which aims to build evidence for health system strengthening and policy-making in the Indian state of Tamil Nadu. Health Policy in India has undergone major reforms over the last few decades, aiming to improve the efficiency and effectiveness of its health systems. The National Rural Health Mission (NRHM) was launched in 2005 as a part of the HSR process with the aim to provide accessible and affordable healthcare services to the rural population. One of the components of NRHM is IPHS, which aims to improve healthcare service delivery and quality through accreditation and certification processes. ANMs are key functionaries under this scheme, responsible for delivering basic maternal and child health services in rural areas. This study will examine the extent to which IPHS has led to improvements in human resource management, particularly in terms of ANMs, and contribute to policy-making and implementation in this area.\u0026rdquo;", "to": "C0048", "value": 9.0, "width": 9.0}, {"arrows": "to", "color": "#0077b6", "from": "C0062", "relation_type": "Part-of", "title": "\u003cb\u003ehealth policy\u003c/b\u003e \u0026rarr; \u003cb\u003ehealth sector reform\u003c/b\u003e\u003cbr/\u003e\u003cb\u003eRelation:\u003c/b\u003e Part-of (Weight: 8)\u003cbr/\u003e\u003ci\u003eEvidence:\u003c/i\u003e oordinated implementation of all the inputs needed for the provision of universal health coverage.\u0026rdquo;", "to": "C0249", "value": 6.0, "width": 6.0}, {"arrows": "to", "color": "#2a9d8f", "from": "C0164", "relation_type": "Application", "title": "\u003cb\u003ecentralization\u003c/b\u003e \u0026rarr; \u003cb\u003emedical education\u003c/b\u003e\u003cbr/\u003e\u003cb\u003eRelation:\u003c/b\u003e Application (Weight: 7)\u003cbr/\u003e\u003ci\u003eEvidence:\u003c/i\u003e \u0026ldquo;The current trend of centralizing control of medical education leaves little leeway for states to adopt medical education that matches the geographical, cultural, social, and economic diversity of India.\u0026rdquo;", "to": "C0165", "value": 7.0, "width": 7.0}, {"arrows": "to", "color": "#2a9d8f", "from": "C0166", "relation_type": "Application", "title": "\u003cb\u003estate\u003c/b\u003e \u0026rarr; \u003cb\u003emedical education\u003c/b\u003e\u003cbr/\u003e\u003cb\u003eRelation:\u003c/b\u003e Application (Weight: 7)\u003cbr/\u003e\u003ci\u003eEvidence:\u003c/i\u003e \u0026ldquo;States should be given more autonomy in adopting medical education to match the local context.\u0026rdquo;", "to": "C0165", "value": 7.0, "width": 7.0}, {"arrows": "to", "color": "#2a9d8f", "from": "C0166", "relation_type": "Application", "title": "\u003cb\u003estate\u003c/b\u003e \u0026rarr; \u003cb\u003etransparency in creating training schedules\u003c/b\u003e\u003cbr/\u003e\u003cb\u003eRelation:\u003c/b\u003e Application (Weight: 7)\u003cbr/\u003e\u003ci\u003eEvidence:\u003c/i\u003e \u0026ldquo;Lack of transparency in creating training schedules, coupled with the erratic posting of personnel, all too often results in the same personnel staying at district or state headquarters, where living conditions are generally better than in the underserved regions.\u0026rdquo;", "to": "C0203", "value": 7.0, "width": 7.0}, {"arrows": "to", "color": "#2a9d8f", "from": "C0166", "relation_type": "Application", "title": "\u u003cbr/\u003e\u003cb\u003eRelation:\u003c/b\u003e Application (Weight: 7)\u003cbr/\u003e\u003ci\u003eEvidence:\u003c/i\u003e \u0026ldquo;The private health sector remains largely unregulated, and the limited rules that exist are rarely enforced. The government could take steps to ensure the existing rules are implemented.\u0026rdquo;", "to": "C0177", "value": 7.0, "width": 7.0}, {"arrows": "to", "color": "#2a9d8f", "from": "C0176", "relation_type": "Application", "title": "\u003cb\u003eprivate health sector regulation\u003c/b\u003e \u0026rarr; \u003cb\u003enew rules for reasonable costs and cap profit margins\u003c/b\u003e\u003cbr/\u003e\u003cb\u003eRelation:\u003c/b\u003e Application (Weight: 7)\u003cbr/\u003e\u003ci\u003eEvidence:\u003c/i\u003e \u0026ldquo;The private health sector remains largely unregulated. The government could create and enforce new rules to ensure reasonable costs to patients and cap the profit margins of the hospitals.\u0026rdquo;", "to": "C0178", "value": 7.0, "width": 7.0}, {"arrows": "to", "color": "#2a9d8f", "from": "C0176", "relation_type": "Application", "title": "\u003cb\u003eprivate health sector regulation\u003c/b\u003e \u0026rarr; \u003cb\u003eimplementation of land allocation conditions\u003c/b\u003e\u003cbr/\u003e\u003cb\u003eRelation:\u003c/b\u003e Application (Weight: 7)\u003cbr/\u003e\u003ci\u003eEvidence:\u003c/i\u003e \u0026ldquo;State-of-the-art corporate hospitals were allocated land in prime urban locations on the premise that a set percentage of patients from economically weaker off sections of society would receive care at little-to-no-cost. The government could take steps to ensure implementation of these land allocation conditions.\u0026rdquo;", "to": "C0179", "value": 7.0, "width": 7.0}, {"arrows": "to", "color": "#2a9d8f", "from": "C0176", "relation_type": "Application", "title": "\u003cb\u003eprivate health sector regulation\u003c/b\u003e \u0026rarr; \u003cb\u003emedical tourism hub\u003c/b\u003e\u003cbr/\u003e\u0
